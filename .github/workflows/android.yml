name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to publish releases

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: 27.3.13750724
      CMAKE_VERSION: 3.22.1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null

      # Building the native dependencies (folly, glog, OpenSSL, ...) for 4
      # ABIs is the slow part: cache them until build-deps.sh changes
      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            _android/src
            _android/*/prefix
            _android/*/build/*.done
          key: wdt-android-deps-${{ env.NDK_VERSION }}-${{ hashFiles('android/build-deps.sh') }}

      - name: Build AAR and sample APKs
        working-directory: android/library
        run: ./gradlew --no-daemon :wdt:assembleRelease :wdt:testReleaseUnitTest :sample:assembleMinified

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp android/library/wdt/build/outputs/aar/wdt-release.aar dist/wdt-android.aar
          for apk in android/library/sample/build/outputs/apk/minified/*.apk; do
            name=$(basename "$apk" .apk)             # sample-<abi>-minified
            abi=${name#sample-}; abi=${abi%-minified}
            cp "$apk" "dist/wdt-sample-$abi.apk"
          done
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "_android/$abi/install/bin/wdt" "dist/wdt-cli-$abi"
          done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: wdt-android
          path: dist/*

  desktop:
    # The oldest supported runner: the binaries then run on older glibcs too
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build > /dev/null
          cmake --version | head -1

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            _desktop/src
            _desktop/host/prefix
            _desktop/host/build/*.done
          key: wdt-desktop-deps-${{ runner.os }}-${{ hashFiles('android/build-deps.sh') }}

      - name: Build awdt and wdt
        env:
          WDT_DESKTOP_TESTS: 1
        run: desktop/build.sh

      - name: Unit tests
        run: |
          mkdir -p "$RUNNER_TEMP/wdt-tests"
          cd _desktop/host/build/wdt/_bin/wdt
          for t in protocol_test test_encdeci64_func test_stats wdt_url_test \
                   wdt_misc_tests encryption_test file_reader_test; do
            TMPDIR="$RUNNER_TEMP/wdt-tests" ./$t
          done

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp _desktop/install/bin/awdt dist/awdt-linux-x86_64
          cp _desktop/install/bin/wdt dist/wdt-linux-x86_64
          ./dist/awdt-linux-x86_64 --version
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: wdt-desktop
          path: dist/*

  publish:
    needs: [build, desktop]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # main: refresh the rolling "latest" pre-release, handy for downloading
      # the APK straight from a phone
      - name: Move the latest tag
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish latest pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: true
          make_latest: false
          body: |
            Built from ${{ github.sha }} by the Android workflow.
            `wdt-sample-arm64-v8a.apk` is the sample app for most phones.
            `awdt-linux-x86_64` receives files from it on a Linux computer:
            `awdt receive ~/Downloads --auto-accept` (see desktop/README.md).
          files: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
